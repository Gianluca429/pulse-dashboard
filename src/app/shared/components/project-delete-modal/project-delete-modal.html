<div class="delete-modal" role="presentation" (click)="onBackdropClick($event)">
  <section
    class="delete-modal__dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="delete-project-title"
  >
    <div class="delete-modal__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M4 7h16"></path>
        <path d="M9 7V4h6v3"></path>
        <path d="M7 7l1 13h8l1-13"></path>
        <path d="M10 11v5M14 11v5"></path>
      </svg>
    </div>

    <div class="delete-modal__content">
      <p class="delete-modal__eyebrow">
        {{ t().projects.delete.eyebrow }}
      </p>

      <h2 id="delete-project-title">
        {{ t().projects.delete.title }}
      </h2>

      <p>
        {{ t().projects.delete.message }}
        <strong>{{ project.name }}</strong
        >.
        {{ t().projects.delete.warning }}
      </p>
    </div>

    <footer class="delete-modal__footer">
      <button class="delete-modal__cancel" type="button" (click)="close()">
        {{ t().projects.delete.cancel }}
      </button>

      <button class="delete-modal__confirm" type="button" (click)="confirm()">
        {{ t().projects.delete.confirm }}
      </button>
    </footer>
  </section>
</div>

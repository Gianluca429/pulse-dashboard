<div class="delete-modal" role="presentation" (click)="onBackdropClick($event)">
  <section
    class="delete-modal__dialog"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="delete-client-title"
  >
    <div class="delete-modal__icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16"></path>
        <path d="M10 11v6"></path>
        <path d="M14 11v6"></path>
        <path d="M6 7l1 13h10l1-13"></path>
        <path d="M9 7V4h6v3"></path>
      </svg>
    </div>

    <p class="delete-modal__eyebrow">
      {{ t().clients.delete.eyebrow }}
    </p>

    <h2 id="delete-client-title">
      {{ t().clients.delete.title }}
    </h2>

    <p class="delete-modal__message">
      {{ t().clients.delete.message }}
      <strong>{{ client.name }}</strong
      >.
    </p>

    <p class="delete-modal__warning">
      {{ t().clients.delete.warning }}
    </p>

    <footer class="delete-modal__footer">
      <button #cancelButton class="delete-modal__cancel" type="button" (click)="close()">
        {{ t().clients.delete.cancel }}
      </button>

      <button class="delete-modal__confirm" type="button" (click)="confirm()">
        {{ t().clients.delete.confirm }}
      </button>
    </footer>
  </section>
</div>

<div class="client-modal" role="presentation" (click)="onBackdropClick($event)">
  <section
    class="client-modal__dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="new-client-title"
  >
    <header class="client-modal__header">
      <div>
        <p class="client-modal__eyebrow">
          {{ t().clients.form.eyebrow }}
        </p>

        <h2 id="new-client-title">
          {{ t().clients.form.title }}
        </h2>

        <p>
          {{ t().clients.form.intro }}
        </p>
      </div>

      <button
        class="client-modal__close"
        type="button"
        [attr.aria-label]="t().clients.form.close"
        (click)="close()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18"></path>
        </svg>
      </button>
    </header>

    <form class="client-modal__form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="client-modal__grid">
        <label class="field">
          <span class="field__label">
            {{ t().clients.form.name }}
          </span>

          <input
            #clientNameInput
            type="text"
            formControlName="name"
            [placeholder]="t().clients.form.namePlaceholder"
          />

          @if (form.controls.name.touched && form.controls.name.invalid) {
            <small class="field__error">
              {{ t().clients.form.requiredField }}
            </small>
          }
        </label>

        <label class="field">
          <span class="field__label">
            {{ t().clients.form.company }}
          </span>

          <input
            type="text"
            formControlName="company"
            [placeholder]="t().clients.form.companyPlaceholder"
          />

          @if (form.controls.company.touched && form.controls.company.invalid) {
            <small class="field__error">
              {{ t().clients.form.requiredField }}
            </small>
          }
        </label>
      </div>

      <label class="field">
        <span class="field__label">
          {{ t().clients.form.email }}
        </span>

        <input
          type="email"
          formControlName="email"
          [placeholder]="t().clients.form.emailPlaceholder"
        />

        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="field__error">
            {{ t().clients.form.emailError }}
          </small>
        }
      </label>

      <div class="client-modal__grid">
        <label class="field">
          <span class="field__label">
            {{ t().clients.form.status }}
          </span>

          <select formControlName="status">
            <option value="active">
              {{ t().clients.active }}
            </option>

            <option value="inactive">
              {{ t().clients.inactive }}
            </option>
          </select>
        </label>

        <label class="field">
          <span class="field__label">
            {{ t().clients.form.lastContact }}
          </span>

          <input type="date" formControlName="lastContact" />

          @if (form.controls.lastContact.touched && form.controls.lastContact.invalid) {
            <small class="field__error">
              {{ t().clients.form.requiredField }}
            </small>
          }
        </label>
      </div>

      <footer class="client-modal__footer">
        <button class="client-modal__cancel" type="button" (click)="close()">
          {{ t().clients.form.cancel }}
        </button>

        <button class="client-modal__submit" type="submit">
          <span aria-hidden="true">+</span>
          {{ t().clients.form.create }}
        </button>
      </footer>
    </form>
  </section>
</div>

<aside class="sidebar">
  <div class="sidebar__top">
    <a class="sidebar__brand" routerLink="/dashboard">
      <span class="sidebar__brand-mark"> P </span>

      <span class="sidebar__brand-text">
        PULSE

        <small>
          {{ t().common.workspace }}
        </small>
      </span>
    </a>

    <nav class="sidebar__nav" [attr.aria-label]="t().navigation.mainNavigation">
      <a
        routerLink="/dashboard"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{
          exact: true,
        }"
        [attr.title]="t().navigation.dashboard"
      >
        <span class="sidebar__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 4h6v6H4zM14 4h6v9h-6zM4 14h6v6H4zM14 17h6v3h-6z" />
          </svg>
        </span>

        <span>
          {{ t().navigation.dashboard }}
        </span>
      </a>

      <a routerLink="/projects" routerLinkActive="is-active" [attr.title]="t().navigation.projects">
        <span class="sidebar__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path
              d="M3 6.5A2.5 2.5 0 0 1 5.5 4H10l2 2h6.5A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"
            />
          </svg>
        </span>

        <span>
          {{ t().navigation.projects }}
        </span>
      </a>

      <a routerLink="/clients" routerLinkActive="is-active" [attr.title]="t().navigation.clients">
        <span class="sidebar__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path
              d="M8.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM15.5 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM3 20v-2.2C3 15.7 4.7 14 6.8 14h3.4c2.1 0 3.8 1.7 3.8 3.8V20ZM14 20v-1.6c0-1.5-.5-2.8-1.5-3.8.5-.4 1.2-.6 1.9-.6h2.9c2 0 3.7 1.6 3.7 3.7V20Z"
            />
          </svg>
        </span>

        <span>
          {{ t().navigation.clients }}
        </span>
      </a>

      <a routerLink="/invoices" routerLinkActive="is-active" [attr.title]="t().navigation.invoices">
        <span class="sidebar__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M6 3h9l3 3v15H6zM9 10h6M9 14h6M9 18h4" />
          </svg>
        </span>

        <span>
          {{ t().navigation.invoices }}
        </span>
      </a>
    </nav>
  </div>

  <div class="sidebar__bottom">
    <nav class="sidebar__secondary" [attr.aria-label]="t().navigation.settingsNavigation">
      <button
        class="sidebar__settings"
        type="button"
        [attr.title]="t().navigation.settings"
        (click)="openSettings()"
      >
        <span class="sidebar__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5ZM19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.8-1L14.4 3h-4.8l-.3 3.1a8 8 0 0 0-1.8 1l-2.4-1-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 1.8 1l.3 3.1h4.8l.3-3.1a8 8 0 0 0 1.8-1l2.4 1 2-3.4-2-1.5a7 7 0 0 0 .1-1Z"
            />
          </svg>
        </span>

        <span>
          {{ t().navigation.settings }}
        </span>
      </button>
    </nav>

    <button
      class="sidebar__profile"
      type="button"
      [attr.aria-label]="t().navigation.openProfile"
      [attr.title]="t().navigation.openProfile"
    >
      <span class="sidebar__avatar"> GL </span>

      <span class="sidebar__profile-copy">
        <strong> Gianluca </strong>

        <small>
          {{ t().profile.role }}
        </small>
      </span>

      <span class="sidebar__profile-more" aria-hidden="true"> ••• </span>
    </button>
  </div>
</aside>

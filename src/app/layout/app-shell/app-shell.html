<div class="app-shell">
  <app-sidebar (settingsRequested)="openSettings()" />

  <div class="app-shell__main">
    <app-topbar (settingsRequested)="openSettings()" />

    <main class="app-shell__content">
      <router-outlet />
    </main>
  </div>
</div>

@if (isSettingsOpen()) {
  <app-settings-drawer (closed)="closeSettings()" />
}

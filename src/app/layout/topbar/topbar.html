<header class="topbar">
  <div class="topbar__left">
    <button
      class="topbar__menu-button"
      type="button"
      [attr.aria-label]="isMobileMenuOpen() ? t().common.closeMenu : t().common.openMenu"
      [attr.aria-expanded]="isMobileMenuOpen()"
      aria-controls="mobile-navigation"
      (click)="toggleMobileMenu()"
    >
      @if (isMobileMenuOpen()) {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12"></path>
          <path d="M18 6 6 18"></path>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16"></path>
          <path d="M4 12h16"></path>
          <path d="M4 17h16"></path>
        </svg>
      }
    </button>

    <div class="topbar__heading">
      <p class="topbar__eyebrow">
        {{ t().common.workspace }}
      </p>

      <h1 class="topbar__title">
        {{ pageTitle() }}
      </h1>
    </div>
  </div>

  <div class="topbar__actions">
    <label class="topbar__search">
      <span class="topbar__search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"></circle>

          <path d="m20 20-4-4"></path>
        </svg>
      </span>

      <input
        type="search"
        [placeholder]="t().common.search"
        [attr.aria-label]="t().common.search"
      />

      <kbd>⌘ K</kbd>
    </label>

    <div class="topbar__language" [attr.aria-label]="t().common.languageSelector">
      <button
        type="button"
        [class.is-active]="translation.language() === 'en'"
        [attr.aria-pressed]="translation.language() === 'en'"
        (click)="setLanguage('en')"
      >
        EN
      </button>

      <button
        type="button"
        [class.is-active]="translation.language() === 'it'"
        [attr.aria-pressed]="translation.language() === 'it'"
        (click)="setLanguage('it')"
      >
        IT
      </button>
    </div>

    <button class="topbar__icon-button" type="button" [attr.aria-label]="t().common.notifications">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>

        <path d="M10 21h4"></path>
      </svg>

      <span class="topbar__notification-dot" aria-hidden="true"></span>
    </button>
  </div>
</header>

@if (isMobileMenuOpen()) {
  <div class="mobile-nav" (click)="onBackdropClick($event)">
    <aside
      id="mobile-navigation"
      class="mobile-nav__drawer"
      [attr.aria-label]="t().navigation.mainNavigation"
    >
      <div class="mobile-nav__brand">
        <span class="mobile-nav__brand-mark"> P </span>

        <span class="mobile-nav__brand-copy">
          <strong> PULSE </strong>

          <small>
            {{ t().common.workspace }}
          </small>
        </span>
      </div>

      <nav class="mobile-nav__links">
        <a
          routerLink="/dashboard"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{
            exact: true,
          }"
          (click)="closeMobileMenu()"
        >
          <span class="mobile-nav__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M4 4h6v6H4zM14 4h6v9h-6zM4 14h6v6H4zM14 17h6v3h-6z"></path>
            </svg>
          </span>

          {{ t().navigation.dashboard }}
        </a>

        <a routerLink="/projects" routerLinkActive="is-active" (click)="closeMobileMenu()">
          <span class="mobile-nav__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M3 6.5A2.5 2.5 0 0 1 5.5 4H10l2 2h6.5A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"
              ></path>
            </svg>
          </span>

          {{ t().navigation.projects }}
        </a>

        <a routerLink="/clients" routerLinkActive="is-active" (click)="closeMobileMenu()">
          <span class="mobile-nav__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M8.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM15.5 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM3 20v-2.2C3 15.7 4.7 14 6.8 14h3.4c2.1 0 3.8 1.7 3.8 3.8V20ZM14 20v-1.6c0-1.5-.5-2.8-1.5-3.8.5-.4 1.2-.6 1.9-.6h2.9c2 0 3.7 1.6 3.7 3.7V20Z"
              ></path>
            </svg>
          </span>

          {{ t().navigation.clients }}
        </a>

        <a routerLink="/invoices" routerLinkActive="is-active" (click)="closeMobileMenu()">
          <span class="mobile-nav__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M6 3h9l3 3v15H6zM9 10h6M9 14h6M9 18h4"></path>
            </svg>
          </span>

          {{ t().navigation.invoices }}
        </a>
      </nav>

      <div class="mobile-nav__bottom">
        <button class="mobile-nav__settings" type="button" (click)="openSettings()">
          <span class="mobile-nav__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5ZM19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.8-1L14.4 3h-4.8l-.3 3.1a8 8 0 0 0-1.8 1l-2.4-1-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 1.8 1l.3 3.1h4.8l.3-3.1a8 8 0 0 0 1.8-1l2.4 1 2-3.4-2-1.5a7 7 0 0 0 .1-1Z"
              ></path>
            </svg>
          </span>

          {{ t().navigation.settings }}
        </button>

        <div class="mobile-nav__profile">
          <span class="mobile-nav__avatar"> GL </span>

          <div>
            <strong> Gianluca </strong>

            <small>
              {{ t().profile.role }}
            </small>
          </div>
        </div>
      </div>
    </aside>
  </div>
}
